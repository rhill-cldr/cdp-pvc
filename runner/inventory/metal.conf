_meta: {
    hostvars: {}
}
all: {
    children: [
        equinix
    ]
}
equinix: {
    vars: {
        os: rhel_8
        primary-cluster-name: Detroit
        secondary-cluster-name: Austin
        ansible_user: root
        ansible_connection: ssh
        ansible_ssh_private_key_file: ${METAL_ROOT_KEY}
    }
    children: [
        metal_haproxy
        metal_cluster
    ]
}
metal_proxy0: {
    host: ${METAL_DOMAIN}
    hosts: [
        ${METAL_DOMAIN}
    ]
    vars: {
        os: ${equinix.vars.os}
        the_pwd: ${THE_PWD}
        realm_name: ${REALM_NAME}
        krb_domain: ${KRB_DOMAIN}
        cm_principal: ${CM_PRINCIPAL}
        users_group: ${USERS_GROUP}
        admins_group: ${ADMINS_GROUP}
        keytabs_dir: ${KEYTABS_DIR}
        cdp_airflow_version: ${CDP_AIRFLOW_VERSION}
        airflow_constraints: ${AIRFLOW_CONSTRAINTS}
        airflow_constraints_file: ${AIRFLOW_CONSTRAINTS_FILE}
        airflow_providers: "async,beam,celery,postgres,amazon,azure,hdfs,hive,spark,sqoop,grpc"
    }
    children: []
    environment: [
        REALM_NAME: ${REALM_NAME}
    ]
}
metal_cluster: {
    vars: {
        cloudera_username: ${CLOUDERA_USERNAME}
        cloudera_password: ${CLOUDERA_PASSWORD}
        realm_name: ${REALM_NAME}
        ipa_server_host:   ${IPA_SERVER_HOST}
        the_pwd: ${THE_PWD}
        host-name-range: "base-0[1-2]."${KRB_DOMAIN}
        host-template-ref-name: base-primary-cluster
    }
    hosts: [
        ${METAL_DOMAIN}
        admin-01.${KRB_DOMAIN}
        admin-02.${KRB_DOMAIN}
        base-01.${KRB_DOMAIN}
        base-02.${KRB_DOMAIN}
        base-03.${KRB_DOMAIN}
        base-04.${KRB_DOMAIN}
        base-05.${KRB_DOMAIN}
       # kudu-master-00.${KRB_DOMAIN}
       # kudu-master-01.${KRB_DOMAIN}
       # kudu-master-02.${KRB_DOMAIN}
       # kudu-ts-00.${KRB_DOMAIN}
       # kudu-ts-01.${KRB_DOMAIN}
       # kudu-ts-02.${KRB_DOMAIN}
       # kudu-ts-03.${KRB_DOMAIN}
       # kudu-ts-04.${KRB_DOMAIN}
       # ozone-om-01.${KRB_DOMAIN}
       # ozone-scm-00.${KRB_DOMAIN}
       # ozone-data-000.${KRB_DOMAIN}
       # ozone-data-001.${KRB_DOMAIN}
       # ozone-data-002.${KRB_DOMAIN}
    ]
    children: [metal_admin]
}
metal_admin: {
    vars: {
        cloudera_manager_license_file: ${CLOUDERA_MANAGER_LICENSE_FILE}
        license_local_tmp_path: /tmp/license.txt
        cloudera_manager_api_user: admin
        cloudera_manager_api_password: admin
        cloudera_username: ${CLOUDERA_USERNAME}
        cloudera_password: ${CLOUDERA_PASSWORD}
        realm_name: ${REALM_NAME}
        ipa_server_host:   ${IPA_SERVER_HOST}
        the_pwd: ${THE_PWD}
        default_pg_password: ${DEFAULT_PG_PASSWORD}
        postgresql_10_host: admin-01.${KRB_DOMAIN}
    }
    hosts: [
        admin-01.${KRB_DOMAIN}
        admin-02.${KRB_DOMAIN}
    ]
    children: []
}
