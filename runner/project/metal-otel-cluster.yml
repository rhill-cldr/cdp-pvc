---
- name: Observability requirements
  hosts: otel_cluster
  remote_user: root
  pre_tasks:
    - name: Ensure packages are at the latest version
      ansible.builtin.dnf: "name={{ item }} state=latest"
      with_items:
        - bash
        - chrony
        - git
        - nfs-utils
        - nmap
        - iptables
        - sshpass
        - python3.11
        - python3.11-pip
        - postgresql
        - postgresql-jdbc
        - python3.11-psycopg2
        - freeipa-client
        - krb5-workstation
        - krb5-libs
        - java-11-openjdk-devel

  tasks:
    - name: Check pki working directory
      ansible.builtin.file:
        path: /root/pki
        state: directory
        mode: '0755'
    
    - name: "Start and enable services"
      service: "name={{ item }} state=started enabled=yes"
      with_items:
        - chronyd

