---
- name: Install base pre-reqs 
  hosts: base
  remote_user: root
  pre_tasks:
    - name: Enable Cloudera Manager repo
      ansible.builtin.yum_repository:
        name: cloudera-manager
        description: Cloudera Manager repo
        state: present
        enabled: yes
        baseurl: https://{{ cloudera_username }}:{{ cloudera_password }}@archive.cloudera.com/p/cm7/7.13.1.400/redhat9/yum
        gpgcheck: true
        gpgkey: https://{{ cloudera_username }}:{{ cloudera_password }}@archive.cloudera.com/p/cm7/7.13.1.400/redhat9/yum/RPM-GPG-KEY-cloudera

    - name: Ensure packages are at the latest version
      ansible.builtin.dnf: "name={{ item }} state=latest"
      with_items:
        - python3.11
        - python3.11-pip
        - python3.11-psycopg2
        - java-11-openjdk-devel
        - openldap*
        - krb5-workstation
        - krb5-libs
        - nfs-utils
        - chrony

  tasks:
    - name: Set vm.swappiness to 1
      ansible.builtin.sysctl:
        name: vm.swappiness
        value: 1
        state: present
        sysctl_set: yes

    - name: Enable chronyd service
      ansible.builtin.service:
        name: chronyd
        enabled: yes

    - name: Start chronyd service
      ansible.builtin.service:
        name: chronyd
        state: started

    - name: Disable firewall on all base hosts
      ansible.builtin.service:
        name: firewalld
        state: stopped
        enabled: no

    - name: Ensure /etc/hosts contains required cluster entries
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          172.19.18.148    0398-dsm-lvcpu.kcloud-dev.comops.cloudera.com.maintenance.kcloud-dev.comops.cloudera.com
          172.19.18.150    0400-dsm-lvcpu.kcloud-dev.comops.cloudera.com.maintenance.kcloud-dev.comops.cloudera.com
          172.19.18.151    0401-dsm-lvcpu.kcloud-dev.comops.cloudera.com.maintenance.kcloud-dev.comops.cloudera.com
          172.19.18.152    0402-dsm-lvcpu.kcloud-dev.comops.cloudera.com.maintenance.kcloud-dev.comops.cloudera.com
          172.19.18.153    0403-dsm-lvcpu.kcloud-dev.comops.cloudera.com.maintenance.kcloud-dev.comops.cloudera.com
          172.19.18.154    0404-dsm-lvcpu.kcloud-dev.comops.cloudera.com.maintenance.kcloud-dev.comops.cloudera.com
        state: present
        create: yes

    - name: Disable Transparent Hugepage defrag
      ansible.builtin.shell: echo never > /sys/kernel/mm/transparent_hugepage/defrag
      args:
        creates: /sys/kernel/mm/transparent_hugepage/defrag

    - name: Disable Transparent Hugepage enabled
      ansible.builtin.shell: echo never > /sys/kernel/mm/transparent_hugepage/enabled
      args:
        creates: /sys/kernel/mm/transparent_hugepage/enabled

    - name: Ensure THP settings persist in /etc/rc.local
      ansible.builtin.blockinfile:
        path: /etc/rc.local
        block: |
          echo never > /sys/kernel/mm/transparent_hugepage/defrag
          echo never > /sys/kernel/mm/transparent_hugepage/enabled
        create: yes
        mode: '0755'

    - name: Ensure system timezone is set to UTC
      ansible.builtin.command:
        cmd: timedatectl set-timezone UTC

